name: Galatasaray Match Tracker

'on':
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  match-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test API connection
        run: python test_api.py

      - name: Run Galatasaray tracker
        run: python main.py
